# Shared conda environment for the whole project.
#   create:  conda env create -f environment.yml
#   update:  conda env update -f environment.yml --prune
#   use:     conda activate advai-news
name: advai-news
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  # data + EDA
  - datasets=3.0
  - pandas=2.2
  - pyarrow=17
  - numpy=1.26
  - matplotlib=3.9
  - seaborn=0.13
  - langdetect=1.0.9
  # pipeline + evaluation baselines
  - scikit-learn=1.5
  - datasketch=1.6
  # notebooks
  - jupyterlab=4.2
  - ipykernel=6.29
  - pip
  - pip:
      # training: MLX runs only on Apple Silicon Macs; skipped elsewhere
      - "mlx-lm==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'"
